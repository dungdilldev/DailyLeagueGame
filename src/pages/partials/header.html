<header class="site-header">
  <div class="site-header__inner">

          </linearGradient>
          <radialGradient id="brand-coin" cx="0.5" cy="0.4" r="0.6">
            <stop offset="0" stop-color="#1a4a6e" />
            <stop offset="0.6" stop-color="#0c1a2e" />
            <stop offset="1" stop-color="#050d1a" />
          </radialGradient>
        </defs>
        <circle
          cx="60"
          cy="60"

          fill="url(#brand-coin)"

        <g transform="translate(60 60) scale(0.72) translate(-60 -60)">

    <div class="site-header__end">
      <nav class="site-nav" aria-label="Main">
        <a href="how-to-play.html">How to play</a>
        <a href="./#modes">Categories</a>
        <a href="about.html">About</a>
        <a class="site-nav__play" href="trivia.html">Play</a>
      </nav>
      <div class="settings" data-settings>
        <button
          type="button"
          class="settings__gear"
          aria-label="Settings"
          aria-expanded="false"
          aria-controls="settings-panel"
          title="Settings"
        >
          <svg class="icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"

        </button>
        <div class="settings__panel" id="settings-panel" hidden>
          <p class="settings__title">Settings</p>
          <label class="settings__option">
            <input class="settings__switch" type="checkbox" role="switch" data-colorblind-toggle />
            <span>
              <span class="settings__name">Colorblind mode</span>
              <span class="settings__hint">
                <span class="settings__swatch settings__swatch--ok" aria-hidden="true"></span>
                <span class="settings__swatch settings__swatch--bad" aria-hidden="true"></span>
                Blue and orange instead of green and red
              </span>
            </span>
          </label>
        </div>
      </div>
    </div>
  </div>
</header>
